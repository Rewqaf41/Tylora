<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
  <title id="title">Tylora window management preview</title>
  <desc id="desc">Illustration of a macOS desktop with neatly tiled windows and three layout choices.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#15171c"/><stop offset="1" stop-color="#090a0e"/></linearGradient>
    <linearGradient id="glow" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#ff9d58"/><stop offset="1" stop-color="#ee6714"/></linearGradient>
    <linearGradient id="panel" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#252831"/><stop offset="1" stop-color="#191b22"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity=".45"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="60"/></filter>
  </defs>
  <rect width="1200" height="590" rx="30" fill="url(#bg)"/>
  <circle cx="1040" cy="75" r="190" fill="#e65f1e" opacity=".16" filter="url(#soft)"/>
  <circle cx="80" cy="550" r="150" fill="#397c80" opacity=".13" filter="url(#soft)"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <g transform="translate(60 68)">
      <rect width="48" height="48" rx="13" fill="#252830"/>
      <path d="M11 12h15v15L10 21v-7a2 2 0 0 1 1-2Z" fill="url(#glow)"/>
      <path d="M28 12h12v9l-12 7V12Z" fill="#d9e1e9"/>
      <path d="m18 29 8 3v12l-5-2c-2-1-3-3-3-5v-8Z" fill="#aeb9c4"/>
      <text x="62" y="33" fill="#f6f4f0" font-size="28" font-weight="700">Tylora</text>
      <text x="0" y="100" fill="#ff9f62" font-size="13" font-weight="700" letter-spacing="2.6">MAKE SPACE FOR FOCUS</text>
      <text x="0" y="158" fill="#faf8f5" font-size="44" font-weight="700">Your windows,</text>
      <text x="0" y="211" fill="#faf8f5" font-size="44" font-weight="700">in their place.</text>
      <text x="0" y="257" fill="#a7a9b1" font-size="18">Tiling, native Spaces, and shortcuts</text>
      <text x="0" y="284" fill="#a7a9b1" font-size="18">for a calmer macOS desktop.</text>
      <g transform="translate(0 333)">
        <rect width="115" height="38" rx="19" fill="#f26b16"/><text x="29" y="25" fill="#1b0d04" font-size="14" font-weight="700">BSP</text><circle cx="79" cy="19" r="4" fill="#1b0d04"/>
        <rect x="127" width="105" height="38" rx="19" fill="#292c34"/><text x="145" y="25" fill="#e0e1e4" font-size="14">Dwindle</text>
        <rect x="244" width="113" height="38" rx="19" fill="#292c34"/><text x="260" y="25" fill="#e0e1e4" font-size="14">Scrolling</text>
      </g>
      <text x="0" y="450" fill="#717680" font-size="13">RUST DAEMON  ·  TAURI SETTINGS  ·  APPLE SILICON</text>
    </g>
    <g transform="translate(542 93)" filter="url(#shadow)">
      <rect width="602" height="410" rx="18" fill="#111319" stroke="#56515a"/>
      <rect width="602" height="32" rx="18" fill="#2c2c32"/><path d="M0 18h602v15H0z" fill="#2c2c32"/>
      <circle cx="20" cy="16" r="5" fill="#ff6259"/><circle cx="38" cy="16" r="5" fill="#ffbd2e"/><circle cx="56" cy="16" r="5" fill="#28c840"/>
      <text x="262" y="21" fill="#c3c3c7" font-size="11">Desktop 1 · Code</text>
      <rect x="18" y="49" width="276" height="340" rx="11" fill="url(#panel)" stroke="#514641"/>
      <rect x="308" y="49" width="276" height="161" rx="11" fill="url(#panel)" stroke="#454953"/>
      <rect x="308" y="224" width="276" height="165" rx="11" fill="url(#panel)" stroke="#454953"/>
      <g fill="#ff9c5c" font-size="12" font-weight="600"><text x="36" y="79">01  EDITOR</text><text x="326" y="79">02  BROWSER</text><text x="326" y="254">03  TERMINAL</text></g>
      <g fill="#9196a1"><rect x="36" y="101" width="135" height="7" rx="3"/><rect x="36" y="119" width="226" height="7" rx="3"/><rect x="36" y="137" width="187" height="7" rx="3"/><rect x="36" y="174" width="213" height="7" rx="3"/><rect x="36" y="192" width="154" height="7" rx="3"/><rect x="36" y="229" width="194" height="7" rx="3"/><rect x="36" y="247" width="126" height="7" rx="3"/>
        <rect x="326" y="100" width="222" height="7" rx="3"/><rect x="326" y="118" width="170" height="7" rx="3"/><rect x="326" y="155" width="205" height="7" rx="3"/><rect x="326" y="273" width="184" height="7" rx="3"/><rect x="326" y="292" width="225" height="7" rx="3"/><rect x="326" y="329" width="139" height="7" rx="3"/></g>
      <rect x="36" y="310" width="112" height="26" rx="7" fill="#f26b1630"/><text x="48" y="328" fill="#ffae77" font-size="11">⌥ H  ·  focus left</text>
    </g>
  </g>
</svg>
