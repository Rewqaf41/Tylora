# Release pipeline: a `v*` tag checks, builds and publishes a DMG.
# The public release is ad-hoc signed and unnotarized; release notes explain
# the extra macOS opening step.
# Checks and build run in parallel; publish waits for both. A tag run can only
# restore Rust caches saved on the default branch, so pushes to master run the
# same jobs (without publishing) and are the only runs that save the caches.
name: release

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # A newer master push supersedes a cache warm-up; tag runs always finish.
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

jobs:
  checks:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: checks
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - uses: oven-sh/setup-bun@v2
      - name: Versions agree with the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for version in \
            "$(node -p "require('./apps/gui/package.json').version")" \
            "$(node -p "require('./apps/gui/src-tauri/tauri.conf.json').version")" \
            "$(cargo metadata --no-deps --format-version 1 | node -pe "JSON.parse(require('fs').readFileSync(0)).packages.find(p => p.name === 'tylora-daemon').version")"; do
            [ "$version" = "$tag" ] || { echo "version $version does not match tag $tag"; exit 1; }
          done
      - run: cargo fmt --all --check
      - name: Prepare Tauri sidecar for Rust checks
        run: node apps/gui/scripts/prepare-sidecar.mjs
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Frontend checks
        working-directory: apps/gui
        run: |
          bun install --frozen-lockfile || bun install
          bun run typecheck
          bun run lint
          bun run test

  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - uses: oven-sh/setup-bun@v2
      - name: Build Tylora.app, Tylora.dmg and the signed update archive
        working-directory: apps/gui
        env:
          # minisign key of the in-app updater (not an Apple credential); its
          # public half is plugins.updater.pubkey in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY
          unset APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_PATH
          bun install --frozen-lockfile || bun install
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            bun run desktop:build -- --config '{"bundle":{"createUpdaterArtifacts":true}}'
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set: no in-app update archive; a tag release will fail."
            bun run desktop:build
          fi
      - name: Verify bundle
        run: sh apps/gui/scripts/verify-bundle.sh
      - name: Checksums
        run: |
          cd target/release/bundle/dmg
          shasum -a 256 Tylora_*.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: tylora-adhoc-${{ github.sha }}
          path: |
            target/release/bundle/dmg/Tylora_*.dmg
            target/release/bundle/dmg/SHA256SUMS.txt
            target/release/bundle/macos/Tylora.app.tar.gz
            target/release/bundle/macos/Tylora.app.tar.gz.sig
          if-no-files-found: error

  publish:
    needs: [checks, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tylora-adhoc-${{ github.sha }}
          path: dist
      - name: Prepare stable download names, checksums and latest.json
        run: |
          # upload-artifact keeps paths below the common root (target/release/bundle).
          find dist -type f | sort
          cp dist/dmg/Tylora_*_aarch64.dmg dist/
          cp dist/dmg/Tylora_*_aarch64.dmg dist/Tylora_aarch64.dmg
          [ -f dist/macos/Tylora.app.tar.gz ] && [ -f dist/macos/Tylora.app.tar.gz.sig ] \
            || { echo "missing the signed update archive; set TAURI_SIGNING_PRIVATE_KEY"; exit 1; }
          cp dist/macos/Tylora.app.tar.gz dist/Tylora_aarch64.app.tar.gz
          cp dist/macos/Tylora.app.tar.gz.sig dist/Tylora_aarch64.app.tar.gz.sig
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/Tylora_aarch64.app.tar.gz"
          jq -n --arg version "${GITHUB_REF_NAME#v}" \
            --arg notes "See https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg signature "$(cat dist/Tylora_aarch64.app.tar.gz.sig)" --arg url "$url" \
            '{version: $version, notes: $notes, pub_date: $date,
              platforms: {"darwin-aarch64": {signature: $signature, url: $url}}}' > dist/latest.json
          cat dist/latest.json
          cd dist
          sha256sum Tylora_*.dmg Tylora_aarch64.app.tar.gz > SHA256SUMS.txt
      - name: Write release notes
        run: |
          cat > release-notes.md <<'EOF'
          Download `Tylora_aarch64.dmg` for an Apple Silicon Mac, then drag Tylora into Applications.

          **This build is ad-hoc signed and not notarized.** macOS may block it on first launch. After trying to open Tylora, go to System Settings → Privacy & Security and choose **Open Anyway** for Tylora. Grant Accessibility permission during first-run setup. Only install software from a source you trust.

          PolyForm Noncommercial License 1.0.0: https://polyformproject.org/licenses/noncommercial/1.0.0
          Required Notice: Copyright (c) 2026 Rewqaf41
          EOF
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/Tylora_*.dmg dist/SHA256SUMS.txt \
            dist/Tylora_aarch64.app.tar.gz dist/Tylora_aarch64.app.tar.gz.sig dist/latest.json \
            --repo "$GITHUB_REPOSITORY" --title "Tylora $GITHUB_REF_NAME" \
            --notes-file release-notes.md
