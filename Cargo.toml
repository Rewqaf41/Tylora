[workspace]
members = [
	"crates/tylora-core",
	"crates/tylora-layout",
	"crates/tylora-macos",
	"crates/tylora-config",
	"apps/daemon",
	"apps/gui/src-tauri",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.82"
license = "MIT"

[workspace.dependencies]
tracing = "=0.1.40"
tracing-subscriber = { version = "=0.3.18", features = ["env-filter"] }
serde = { version = "=1.0.214", features = ["derive"] }
serde_json = "=1.0.132"
toml = "=0.8.19"
regex = { version = "=1.11.1", default-features = false, features = ["std", "unicode-case", "unicode-perl"] }
